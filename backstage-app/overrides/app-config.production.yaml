app:
  title: TuskerBlueprint Developer Portal
  baseUrl: ${BACKSTAGE_BASE_URL}

organization:
  name: StoneTusker Systems

backend:
  baseUrl: ${BACKSTAGE_BACKEND_URL}
  listen:
    port: 7007
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  cors:
    origin: ${BACKSTAGE_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:
  rules:
    - allow:
        - Component
        - API
        - Resource
        - System
        - Domain
        - Group
        - User
        - Location
        - Template
  locations:
    - type: url
      target: https://github.com/stonetusker/tuskerblueprint/blob/main/catalog-info.yaml

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

permission:
  enabled: true

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: tuskerblueprint-development
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
          skipMetricsLookup: true

argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: development
          url: https://argocd-server.argocd.svc.cluster.local
          token: ${ARGOCD_AUTH_TOKEN}
