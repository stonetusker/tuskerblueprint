---
extends: default

rules:
  document-start: disable

  empty-lines: disable

  trailing-spaces:
    level: warning

  line-length:
    max: 140
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  truthy:
    ignore: |
      .github/workflows/*.yml

ignore: |
  .terraform/
  node_modules/