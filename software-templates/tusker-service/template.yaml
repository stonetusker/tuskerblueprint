apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: tusker-service
  title: Tusker Service
  description: Create a secure FastAPI service with source code, CI/CD, TechDocs, OpenAPI, Kubernetes manifests, catalog registration, and GitOps onboarding
  tags:
    - recommended
    - python
    - fastapi
    - kubernetes
    - gitops
    - techdocs
    - devsecops
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Service identity
      required:
        - name
        - description
        - owner
        - system
        - developerUsername
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase Kubernetes-compatible service identifier
          pattern: '^[a-z][a-z0-9-]{2,40}$'
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Explain the business capability exposed by the service
        owner:
          title: Owning team
          type: string
          default: group:default/developers
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
        system:
          title: System
          type: string
          default: system:default/tuskerblueprint
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind:
                - System
        developerUsername:
          title: GitHub developer username
          type: string
          description: GitHub user that receives push access to the generated repository
          default: subeeshlearn
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
        port:
          title: Application port
          type: integer
          default: 8000
          minimum: 1024
          maximum: 65535

    - title: Repository
      required:
        - repoUrl
        - repositoryVisibility
      properties:
        repoUrl:
          title: Repository location
          type: string
          description: The platform credential creates the repository and grants the selected developer push access
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - stonetusker
        repositoryVisibility:
          title: Repository visibility
          type: string
          description: Public and private repositories use the same Kubernetes-managed GitHub credentials
          default: private
          enum:
            - private
            - public
          enumNames:
            - Private (recommended)
            - Public

  steps:
    - id: fetch-service
      name: Generate service repository
      action: fetch:template
      input:
        url: ./skeleton/service
        targetPath: ./service
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          developerUsername: ${{ parameters.developerUsername }}
          port: ${{ parameters.port }}
          repoUrl: ${{ parameters.repoUrl }}
          repoVisibility: ${{ parameters.repositoryVisibility }}

    - id: publish-service
      name: Create GitHub repository and grant developer access
      action: publish:github
      input:
        sourcePath: ./service
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: ${{ parameters.repositoryVisibility }}
        protectDefaultBranch: true
        requireCodeOwnerReviews: false
        collaborators:
          - user: ${{ parameters.developerUsername }}
            access: push
        topics:
          - backstage
          - fastapi
          - gitops
          - kubernetes
          - stonetusker
          - tuskerblueprint

    - id: register-service
      name: Register service and API in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-service'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: fetch-gitops
      name: Generate Argo CD onboarding manifest
      action: fetch:template
      input:
        url: ./skeleton/gitops-registration
        targetPath: ./gitops-registration
        values:
          name: ${{ parameters.name }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish-gitops-pr
      name: Open platform GitOps onboarding pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=stonetusker&repo=tuskerblueprint
        branchName: onboard-${{ parameters.name }}
        title: 'feature(gitops): onboard ${{ parameters.name }}'
        description: |
          Registers `${{ parameters.name }}` with the TuskerBlueprint generated-workloads controller.

          The generated service repository owns its Kubernetes base and development overlay. Merge the service release pull request first, then merge this onboarding pull request. Argo CD then follows the service repository and deploys validated immutable releases.

          Review ownership, namespace, selected repository visibility, image policy, and resource settings before merging. Kubernetes-managed Argo CD and GHCR credentials support both public and private repositories.
        sourcePath: ./gitops-registration
        targetPath: gitops/generated-workloads/${{ parameters.name }}

  output:
    text:
      - title: Complete the first immutable release
        content: |
          Open the new repository Actions page, confirm the image is published, and merge the one-file release PR. The cluster-managed GHCR pull Secret supports either a public or private package. Then merge the GitOps onboarding PR.
    links:
      - title: Service repository
        url: ${{ steps['publish-service'].output.remoteUrl }}
      - title: Catalog entity
        icon: catalog
        entityRef: ${{ steps['register-service'].output.entityRef }}
      - title: GitOps onboarding pull request
        url: ${{ steps['publish-gitops-pr'].output.remoteUrl }}
