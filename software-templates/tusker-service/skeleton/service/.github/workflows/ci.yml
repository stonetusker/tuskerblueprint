name: Service CI and Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitleaks.toml"
      - ".semgrep.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "scripts/set-release.py"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitleaks.toml"
      - ".semgrep.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "scripts/set-release.py"
      - ".github/workflows/ci.yml"

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: service-${{ '${{ github.workflow }}' }}-${{ '${{ github.ref }}' }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ values.repoUrl | parseRepoUrl | pick('owner') }}/${{ values.repoUrl | parseRepoUrl | pick('repo') }}
  PYTHON_VERSION: "3.12"
  TRIVY_IMAGE: aquasec/trivy:0.70.0
  SEMGREP_IMAGE: semgrep/semgrep:1.162.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  quality-security-build:
    name: Quality, security and image build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ '${{ env.PYTHON_VERSION }}' }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Format, lint and type-check
        run: |
          set -euo pipefail
          ruff format --check app tests
          ruff check app tests
          mypy app

      - name: Unit tests and coverage
        run: |
          set -euo pipefail
          pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Current-source secret scan
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo" -w /repo "${GITLEAKS_IMAGE}" \
            detect --source /repo --no-git --config /repo/.gitleaks.toml \
            --redact --verbose --exit-code 1 --report-format sarif \
            --report-path /repo/gitleaks.sarif

      - name: Semgrep SAST
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src \
            --entrypoint semgrep "${SEMGREP_IMAGE}" \
            scan --config .semgrep.yml --error --sarif --output /src/semgrep.sarif app tests

      - name: Trivy filesystem scan
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/work" --entrypoint trivy "${TRIVY_IMAGE}" \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 /work

      - name: Build immutable image
        run: |
          set -euo pipefail
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${build_date}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${build_date}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Trivy image scan
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint trivy "${TRIVY_IMAGE}" \
            image --scanners vuln --vuln-type os,library --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Generate SPDX SBOM
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/work" --entrypoint trivy "${TRIVY_IMAGE}" \
            image --format spdx-json --output /work/sbom.spdx.json "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-evidence-${{ '${{ github.sha }}' }}
          path: |
            coverage.xml
            gitleaks.sarif
            semgrep.sarif
            sbom.spdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}

      - name: Publish immutable and bootstrap tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"
          docker manifest inspect "${IMAGE_NAME}:${GITHUB_SHA}" >/dev/null

      - name: Update development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/set-release.py "${GITHUB_SHA}"

      - name: Create immutable release pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
          commit-message: "release: deploy ${{ '${{ github.sha }}' }} to development"
          branch: release/development-${{ '${{ github.sha }}' }}
          delete-branch: true
          title: "release: deploy ${{ '${{ github.sha }}' }} to development"
          body: |
            Automated immutable development release.

            Published image: `ghcr.io/${{ values.repoUrl | parseRepoUrl | pick('owner') }}/${{ values.repoUrl | parseRepoUrl | pick('repo') }}:${{ '${{ github.sha }}' }}`

            Review that only `deploy/overlays/development/kustomization.yaml` changed.
          add-paths: deploy/overlays/development/kustomization.yaml
          labels: |
            automated
            release
