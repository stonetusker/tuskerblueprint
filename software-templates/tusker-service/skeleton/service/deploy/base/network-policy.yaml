apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${{ values.name }}-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${{ values.name }}-allow-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: ${{ values.port }}
