apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: demo-service
  title: StoneTusker Customer Notification API
  description: Buyer-demo workload showing secure CI, immutable delivery, GitOps, observability, and rollback
  annotations:
    backstage.io/techdocs-ref: dir:../../workloads/demo-service
    github.com/project-slug: stonetusker/tuskerblueprint
    argocd/app-name: demo-service-development
    argocd/instance-name: development
    backstage.io/kubernetes-id: demo-service
    backstage.io/kubernetes-namespace: demo-service-development
  tags:
    - buyer-demo
    - fastapi
    - devsecops
    - gitops
    - kubernetes
    - observability
  links:
    - url: https://github.com/stonetusker/tuskerblueprint/tree/main/workloads/demo-service
      title: Application source
      icon: github
    - url: https://github.com/stonetusker/tuskerblueprint/actions/workflows/demo-service-ci.yml
      title: Delivery workflow
      icon: github
    - url: https://localhost:8080/applications/argocd/demo-service-development
      title: Argo CD application
      icon: dashboard
    - url: http://localhost:3000/d/stonetusker-demo-service
      title: Grafana delivery dashboard
      icon: dashboard
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: tuskerblueprint
  providesApis:
    - demo-service-api
  dependsOn:
    - component:default/argocd
    - component:default/traefik
    - component:default/prometheus
    - component:default/grafana
    - component:default/loki
    - resource:default/tuskerblueprint-development-cluster
