---
- name: Verify prerequisites
  ansible.builtin.include_tasks: prerequisites.yml

- name: Ensure Argo CD namespace exists
  ansible.builtin.include_tasks: namespace.yml

- name: Install or upgrade Argo CD
  ansible.builtin.include_tasks: install.yml

- name: Wait for Argo CD
  ansible.builtin.include_tasks: wait.yml

- name: Verify Argo CD installation
  ansible.builtin.include_tasks: verify.yml

- name: Register Git repository
  ansible.builtin.include_tasks: repository.yml

- name: Bootstrap Root Application
  ansible.builtin.include_tasks: root_application.yml

- name: Validate bootstrap
  ansible.builtin.include_tasks: validation.yml
