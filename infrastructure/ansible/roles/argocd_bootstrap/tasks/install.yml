---
- name: Check whether Argo CD release exists
  ansible.builtin.command:
    cmd: >
      helm status
      {{ argocd_release_name }}
      --namespace {{ argocd_namespace }}
      --kubeconfig {{ kubeconfig }}
  register: argocd_status
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Add Argo Helm repository
  ansible.builtin.command:
    cmd: >
      helm repo add
      {{ argocd_chart_repo_name }}
      {{ argocd_chart_repo }}
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  delegate_to: localhost
  become: false
  run_once: true

- name: Install or upgrade Argo CD
  ansible.builtin.command:
    cmd: >
      helm upgrade
      --install
      {{ argocd_release_name }}
      {{ argocd_chart_name }}
      --namespace {{ argocd_namespace }}
      --create-namespace
      --version {{ argocd_chart_version }}
      --wait
      --timeout {{ argocd_wait_timeout }}s
      --values {{ role_path }}/files/values.yaml
      --kubeconfig {{ kubeconfig }}
  delegate_to: localhost
  become: false
  run_once: true
