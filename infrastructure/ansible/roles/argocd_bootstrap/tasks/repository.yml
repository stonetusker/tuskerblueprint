---
- name: Render Argo CD repository secret
  ansible.builtin.template:
    src: repository-secret.yaml.j2
    dest: /tmp/argocd-repository-secret.yaml
    mode: "0600"

- name: Apply Argo CD repository secret
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/argocd-repository-secret.yaml
  register: repo_apply

- name: Verify repository secret exists
  ansible.builtin.command:
    cmd: >
      kubectl get secret
      {{ argocd_repo_secret_name }}
      -n {{ argocd_namespace }}
  register: repo_secret
  changed_when: false
