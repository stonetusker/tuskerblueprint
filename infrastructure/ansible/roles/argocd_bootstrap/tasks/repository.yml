---
- name: Add Argo Helm repository
  ansible.builtin.command:
    cmd: >
      helm repo add
      {{ argocd_helm_repository_name }}
      {{ argocd_helm_repository_url }}
  register: helm_repo_add
  changed_when: "'has been added' in helm_repo_add.stdout"
  failed_when:
    - helm_repo_add.rc != 0
    - "'already exists' not in helm_repo_add.stderr"
  delegate_to: localhost
  become: false
  run_once: true

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

---
- name: Create ArgoCD repository secret
  kubernetes.core.k8s:
    state: present
    template: repository-secret.yaml.j2
