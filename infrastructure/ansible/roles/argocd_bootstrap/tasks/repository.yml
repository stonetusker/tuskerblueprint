---
- name: Read Argo CD repository deploy key into memory
  ansible.builtin.set_fact:
    argocd_repo_private_key: "{{ lookup('file', argocd_repo_key_path) }}"
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Create or update Argo CD repository Secret without a temporary file
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ argocd_repo_secret_name }}"
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        type: git
        url: "{{ argocd_repo_url }}"
        sshPrivateKey: "{{ argocd_repo_private_key }}"
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Remove repository key from Ansible facts
  ansible.builtin.set_fact:
    argocd_repo_private_key: null
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Verify repository Secret exists
  ansible.builtin.command:
    cmd: >
      kubectl get secret
      {{ argocd_repo_secret_name }}
      -n {{ argocd_namespace }}
  register: repo_secret
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true
