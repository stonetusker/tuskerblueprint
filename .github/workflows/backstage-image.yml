name: Backstage IDP Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backstage-app/**"
      - "scripts/backstage/bootstrap-custom-app.sh"
      - "scripts/backstage/set-backstage-release.py"
      - ".github/workflows/backstage-image.yml"
  push:
    branches:
      - main
    paths:
      - "backstage-app/**"
      - "scripts/backstage/bootstrap-custom-app.sh"
      - "scripts/backstage/set-backstage-release.py"
      - ".github/workflows/backstage-image.yml"

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: backstage-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKSTAGE_IMAGE: ghcr.io/stonetusker/tuskerblueprint-backstage
  NODE_VERSION: "22.21.0"
  TRIVY_IMAGE: aquasec/trivy:0.70.0

jobs:
  build-test-publish:
    name: Build, test and publish Backstage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Generate the custom Backstage application
        run: scripts/backstage/bootstrap-custom-app.sh .generated/backstage

      - name: Type-check Backstage
        working-directory: .generated/backstage
        run: corepack yarn tsc

      - name: Test Backstage frontend
        working-directory: .generated/backstage
        run: corepack yarn workspace app test --ci --watchAll=false

      - name: Build Backstage backend bundle
        working-directory: .generated/backstage
        run: corepack yarn build:backend

      - name: Build Backstage image
        run: |
          set -euo pipefail
          docker build \
            --file .generated/backstage/packages/backend/Dockerfile \
            --tag "${BACKSTAGE_IMAGE}:${GITHUB_SHA}" \
            .generated/backstage

      - name: Scan Backstage image
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint trivy "${TRIVY_IMAGE}" \
            image --scanners vuln --vuln-type os,library \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            "${BACKSTAGE_IMAGE}:${GITHUB_SHA}"

      - name: Generate Backstage SPDX SBOM
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/work" --entrypoint trivy "${TRIVY_IMAGE}" \
            image --format spdx-json --output /work/backstage.spdx.json \
            "${BACKSTAGE_IMAGE}:${GITHUB_SHA}"

      - name: Upload Backstage delivery evidence
        uses: actions/upload-artifact@v7
        with:
          name: backstage-sbom-${{ github.sha }}
          path: backstage.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and main Backstage tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag "${BACKSTAGE_IMAGE}:${GITHUB_SHA}" "${BACKSTAGE_IMAGE}:main"
          docker push "${BACKSTAGE_IMAGE}:${GITHUB_SHA}"
          docker push "${BACKSTAGE_IMAGE}:main"
          docker manifest inspect "${BACKSTAGE_IMAGE}:${GITHUB_SHA}" >/dev/null

      - name: Update development Backstage release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/backstage/set-backstage-release.py "${GITHUB_SHA}"

      - name: Create immutable Backstage release pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "release(backstage): deploy ${{ github.sha }} to development"
          branch: release/backstage-${{ github.sha }}
          delete-branch: true
          title: "release(backstage): deploy ${{ github.sha }} to development"
          body: |
            Automated immutable Backstage development release.

            Published image: `ghcr.io/stonetusker/tuskerblueprint-backstage:${{ github.sha }}`

            Review that only `platform-services/backstage/values/development-idp.yaml` changed.
          add-paths: platform-services/backstage/values/development-idp.yaml
          labels: |
            automated
            backstage
            release
