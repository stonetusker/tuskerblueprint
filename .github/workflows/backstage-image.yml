name: Backstage IDP Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'backstage-app/**'
      - 'scripts/backstage/bootstrap-custom-app.sh'
      - '.github/workflows/backstage-image.yml'

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: backstage-image-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'

jobs:
  build:
    name: Build and scan Backstage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Generate custom Backstage application
        env:
          BACKSTAGE_APP_NAME: tuskerblueprint-backstage
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: bash scripts/backstage/bootstrap-custom-app.sh

      - name: Verify generated application
        run: |
          test -f .generated/backstage/package.json
          test -f .generated/backstage/yarn.lock
          test -f .generated/backstage/packages/backend/Dockerfile

      - name: Validate Backstage application
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          yarn tsc
          yarn test --ci
          yarn build:backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tuskerblueprint-backstage" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push Backstage image
        uses: docker/build-push-action@v6
        with:
          context: .generated/backstage
          file: .generated/backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan Backstage image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-backstage.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-backstage.sarif') != ''
        with:
          sarif_file: trivy-backstage.sarif
