name: Backstage IDP Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backstage-app/**'
      - 'scripts/backstage/bootstrap-custom-app.sh'
      - '.github/workflows/backstage-image.yml'

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: backstage-image-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  YARN_ENABLE_SCRIPTS: 'false'
  IMAGE_NAME: ghcr.io/stonetusker/tuskerblueprint-backstage
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Enable Corepack
        run: corepack enable

      - name: Generate custom Backstage application
        run: scripts/backstage/bootstrap-custom-app.sh

      - name: Validate generated application
        working-directory: .generated/backstage
        run: |
          corepack yarn tsc
          corepack yarn workspace app test --ci --runInBand --passWithNoTests
          corepack yarn workspace backend build

      - name: Build Backstage image
        working-directory: .generated/backstage
        run: |
          docker build \
            --file packages/backend/Dockerfile \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Scan Backstage image
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              --entrypoint trivy "${TRIVY_IMAGE}" "$@"
          }
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and main tags
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"
