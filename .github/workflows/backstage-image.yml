name: Backstage IDP Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'backstage-app/**'
      - 'scripts/backstage/bootstrap-custom-app.sh'
      - '.github/workflows/backstage-image.yml'

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: backstage-image-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  npm_config_python: /usr/bin/python3
  PYTHON: /usr/bin/python3

jobs:
  build:
    name: Build and scan Backstage
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install native build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install --yes \
            python3 \
            make \
            g++ \
            pkg-config \
            libsecret-1-dev

      - name: Enable Corepack
        run: |
          set -euo pipefail

          corepack enable

          echo "Node version:"
          node --version

          echo "Corepack version:"
          corepack --version

      - name: Generate custom Backstage application
        env:
          BACKSTAGE_APP_NAME: tuskerblueprint-backstage
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          npm_config_python: /usr/bin/python3
          PYTHON: /usr/bin/python3
        run: |
          set -euo pipefail

          bash scripts/backstage/bootstrap-custom-app.sh

      - name: Verify generated application
        run: |
          set -euo pipefail

          test -f .generated/backstage/package.json
          test -f .generated/backstage/yarn.lock
          test -f .generated/backstage/packages/app/package.json
          test -f .generated/backstage/packages/backend/package.json
          test -f .generated/backstage/packages/backend/Dockerfile

          echo "Generated application package manager:"
          node -p "require('./.generated/backstage/package.json').packageManager"

          echo "Generated application Yarn version:"
          (
            cd .generated/backstage
            corepack yarn --version
          )

          echo "Generated workspaces:"
          (
            cd .generated/backstage
            corepack yarn workspaces list
          )

      - name: Type-check Backstage application
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          echo "Node version: $(node --version)"
          echo "Yarn version: $(corepack yarn --version)"

          corepack yarn tsc

      - name: Test Backstage frontend
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn workspace app test \
            --ci \
            --runInBand \
            --passWithNoTests

      - name: Build Backstage backend
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn workspace backend build

      - name: Verify backend build output
        run: |
          set -euo pipefail

          test -d .generated/backstage/packages/backend/dist

          echo "Backend build completed successfully."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tuskerblueprint-backstage"

          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${IMAGE_NAME}"

      - name: Build and push Backstage image
        uses: docker/build-push-action@v6
        with:
          context: .generated/backstage
          file: .generated/backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan Backstage image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-backstage.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-backstage.sarif') != ''
        with:
          sarif_file: trivy-backstage.sarif