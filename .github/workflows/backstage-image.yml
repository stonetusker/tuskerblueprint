name: Backstage IDP Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'backstage-app/**'
      - 'scripts/backstage/bootstrap-custom-app.sh'
      - '.github/workflows/backstage-image.yml'

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: backstage-image-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_python: /usr/bin/python3
  PYTHON: /usr/bin/python3
  TRIVY_NO_PROGRESS: 'true'

jobs:
  build:
    name: Build and scan Backstage
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install generation dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            python3 \
            make \
            g++ \
            pkg-config \
            libsecret-1-dev \
            rsync

      - name: Enable Corepack
        run: |
          set -euo pipefail

          corepack enable

          echo "Node version: $(node --version)"
          echo "Corepack version: $(corepack --version)"

      - name: Generate custom Backstage application
        env:
          BACKSTAGE_APP_NAME: tuskerblueprint-backstage
        run: |
          set -euo pipefail

          bash scripts/backstage/bootstrap-custom-app.sh

      - name: Verify generated application
        run: |
          set -euo pipefail

          test -f .generated/backstage/package.json
          test -f .generated/backstage/yarn.lock
          test -f .generated/backstage/backstage.json
          test -f .generated/backstage/.yarnrc.yml
          test -f .generated/backstage/packages/app/package.json
          test -f .generated/backstage/packages/backend/package.json
          test -s .generated/backstage/packages/backend/Dockerfile

          echo "Generated Backstage release: $(
            node -p "require('./.generated/backstage/backstage.json').version"
          )"

          echo "Generated package manager: $(
            node -p "require('./.generated/backstage/package.json').packageManager"
          )"

          if grep -q \
            'corepack yarn cache clean' \
            .generated/backstage/packages/backend/Dockerfile; then
            echo "Unsupported Dockerfile cache-clean command detected." >&2
            exit 1
          fi

          echo "Generated Dockerfile artifact references:"

          grep -nE \
            'skeleton\.tar\.gz|bundle\.tar\.gz' \
            .generated/backstage/packages/backend/Dockerfile

          grep -q \
            'packages/backend/dist/skeleton.tar.gz' \
            .generated/backstage/packages/backend/Dockerfile

          grep -q \
            'packages/backend/dist/bundle.tar.gz' \
            .generated/backstage/packages/backend/Dockerfile

          (
            cd .generated/backstage

            echo "Generated Yarn version: $(corepack yarn --version)"
            corepack yarn workspaces list
          )

      - name: Type-check Backstage application
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn tsc

      - name: Test Backstage frontend
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn workspace app test \
            --ci \
            --watchAll=false \
            --runInBand \
            --passWithNoTests

      - name: Build Backstage backend
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn workspace backend build

      - name: Verify backend container artifacts
        run: |
          set -euo pipefail

          SKELETON_ARCHIVE=".generated/backstage/packages/backend/dist/skeleton.tar.gz"
          BUNDLE_ARCHIVE=".generated/backstage/packages/backend/dist/bundle.tar.gz"

          test -s "${SKELETON_ARCHIVE}"
          test -s "${BUNDLE_ARCHIVE}"

          tar -tzf "${SKELETON_ARCHIVE}" >/dev/null
          tar -tzf "${BUNDLE_ARCHIVE}" >/dev/null

          ls -lh \
            "${SKELETON_ARCHIVE}" \
            "${BUNDLE_ARCHIVE}"

          echo "Backstage backend container artifacts are valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tuskerblueprint-backstage"

          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${IMAGE_NAME}"

      # Publish only the immutable SHA initially. The main tag is promoted
      # after runtime and security validation.
      - name: Build and push Backstage SHA image
        uses: docker/build-push-action@v6
        with:
          context: .generated/backstage
          file: .generated/backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # This catches runtime dependency and plugin-wiring failures that
      # TypeScript compilation and the Docker build cannot detect.
      - name: Smoke test Backstage runtime
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          CONTAINER_NAME="backstage-smoke"
          SMOKE_URL="http://127.0.0.1:17007"
          BACKEND_SECRET_VALUE="$(openssl rand -hex 32)"
          HEALTHY='false'

          cleanup() {
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          docker pull "${IMAGE_REF}"

          docker run --detach \
            --name "${CONTAINER_NAME}" \
            --publish 17007:7007 \
            --env BACKSTAGE_BASE_URL="${SMOKE_URL}" \
            --env BACKSTAGE_BACKEND_URL="${SMOKE_URL}" \
            --env AUTH_GITHUB_CLIENT_ID="smoke-test-client" \
            --env AUTH_GITHUB_CLIENT_SECRET="smoke-test-secret" \
            --env BACKEND_SECRET="${BACKEND_SECRET_VALUE}" \
            --env GITHUB_TOKEN="smoke-test-token" \
            --env ARGOCD_AUTH_TOKEN="smoke-test-token" \
            "${IMAGE_REF}"

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error \
              "${SMOKE_URL}/api/catalog/health" \
              >/dev/null; then
              HEALTHY='true'
              echo "Catalog health endpoint is ready."
              break
            fi

            RUNNING="$(
              docker inspect \
                --format '{{.State.Running}}' \
                "${CONTAINER_NAME}" \
                2>/dev/null || echo 'false'
            )"

            if [[ "${RUNNING}" != 'true' ]]; then
              echo "Backstage smoke-test container stopped unexpectedly." >&2
              docker logs "${CONTAINER_NAME}" 2>&1 \
                | tee backstage-smoke.log
              exit 1
            fi

            echo "Waiting for Backstage startup: attempt ${attempt}/40"
            sleep 3
          done

          docker logs "${CONTAINER_NAME}" 2>&1 \
            | tee backstage-smoke.log

          if [[ "${HEALTHY}" != 'true' ]]; then
            echo "Catalog health endpoint did not become ready." >&2
            exit 1
          fi

          if grep -Eiq \
            'BackendStartupError|core\.auditor|core\.permissionsRegistry|startup failed|unhandled rejection|fatal' \
            backstage-smoke.log; then
            echo "Backstage runtime startup errors were detected." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            "${SMOKE_URL}/" \
            >/dev/null

          echo "Backstage runtime smoke test passed."

      - name: Upload Backstage smoke-test logs
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('backstage-smoke.log') != ''
        with:
          name: backstage-smoke-test-log
          path: backstage-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.72.0

      - name: Generate Trivy SARIF report
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format sarif \
            --output trivy-backstage.sarif \
            "${IMAGE_REF}"

          test -s trivy-backstage.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-backstage.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-backstage.sarif
          category: trivy-backstage-container

      - name: Display Trivy vulnerability report
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format table \
            --output trivy-backstage.txt \
            "${IMAGE_REF}"

          test -s trivy-backstage.txt
          cat trivy-backstage.txt

      - name: Upload Trivy reports as workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-backstage-reports
          path: |
            trivy-backstage.sarif
            trivy-backstage.txt
          if-no-files-found: warn
          retention-days: 14

      # Advisory initially. This step produces a warning when unfixed
      # CRITICAL findings exist, but does not fail the complete workflow.
      - name: Check critical vulnerability policy
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "${IMAGE_REF}"

      # Promote main only after generation, compilation, tests, packaging,
      # runtime startup, and vulnerability reporting have completed.
      - name: Promote validated image to main
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:main" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Promoted ${IMAGE_NAME}:${GITHUB_SHA} to ${IMAGE_NAME}:main"
          