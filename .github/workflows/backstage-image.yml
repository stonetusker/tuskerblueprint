name: Backstage IDP Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'backstage-app/**'
      - 'scripts/backstage/bootstrap-custom-app.sh'
      - '.github/workflows/backstage-image.yml'

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: backstage-image-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_python: /usr/bin/python3
  PYTHON: /usr/bin/python3
  TRIVY_NO_PROGRESS: 'true'

jobs:
  build:
    name: Build and scan Backstage
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install generation dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            python3 \
            make \
            g++ \
            pkg-config \
            libsecret-1-dev \
            rsync

      - name: Enable Corepack
        run: |
          set -euo pipefail

          corepack enable

          echo "Node version: $(node --version)"
          echo "Corepack version: $(corepack --version)"

      - name: Generate custom Backstage application
        env:
          BACKSTAGE_APP_NAME: tuskerblueprint-backstage
        run: |
          set -euo pipefail

          bash scripts/backstage/bootstrap-custom-app.sh

      - name: Verify generated application
        run: |
          set -euo pipefail

          test -f .generated/backstage/package.json
          test -f .generated/backstage/yarn.lock
          test -f .generated/backstage/.yarnrc.yml
          test -f .generated/backstage/packages/app/package.json
          test -f .generated/backstage/packages/backend/package.json
          test -f .generated/backstage/packages/backend/Dockerfile

          test -s .generated/backstage/packages/backend/Dockerfile

          if grep -qE \
            'skeleton\.tar\.gz|bundle\.tar\.gz' \
            .generated/backstage/packages/backend/Dockerfile; then
            echo "Obsolete tarball-based Backstage Dockerfile detected." >&2
            exit 1
          fi
          
          if grep -q \
            'corepack yarn cache clean' \
            .generated/backstage/packages/backend/Dockerfile; then
            echo "Obsolete Dockerfile content detected." >&2
            exit 1
          fi

          echo "Generated package manager: $(
            node -p "require('./.generated/backstage/package.json').packageManager"
          )"

          (
            cd .generated/backstage

            echo "Generated Yarn version: $(corepack yarn --version)"
            corepack yarn workspaces list
          )

      - name: Type-check Backstage application
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn tsc

      - name: Test Backstage frontend
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn workspace app test \
            --ci \
            --runInBand \
            --passWithNoTests

      - name: Build Backstage backend
        working-directory: .generated/backstage
        env:
          CI: 'true'
        run: |
          set -euo pipefail

          corepack yarn workspace backend build

      - name: Verify backend build output
        run: |
          set -euo pipefail

          test -d .generated/backstage/packages/backend/dist

          if ! find \
            .generated/backstage/packages/backend/dist \
            -type f \
            -print \
            -quit \
            | grep -q .; then
            echo "Backend dist directory contains no files." >&2
            exit 1
          fi

          echo "Backend build output:"
          find \
            .generated/backstage/packages/backend/dist \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tuskerblueprint-backstage"

          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${IMAGE_NAME}"

      - name: Build and push Backstage image
        uses: docker/build-push-action@v6
        with:
          context: .generated/backstage
          file: .generated/backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Pin the Trivy setup action instead of using trivy-action@master.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.72.0

      - name: Generate Trivy SARIF report
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format sarif \
            --output trivy-backstage.sarif \
            "${IMAGE_REF}"

          test -s trivy-backstage.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-backstage.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-backstage.sarif
          category: trivy-backstage-container

      - name: Display Trivy vulnerability report
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format table \
            --output trivy-backstage.txt \
            "${IMAGE_REF}"

          cat trivy-backstage.txt

      - name: Upload Trivy reports as workflow artifacts
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-backstage.sarif') != ''
        with:
          name: trivy-backstage-reports
          path: |
            trivy-backstage.sarif
            trivy-backstage.txt
          if-no-files-found: warn
          retention-days: 14

      # Advisory initially. The step will show a warning for unfixed CRITICAL
      # findings but will not fail the complete image workflow.
      - name: Check critical vulnerability policy
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "${IMAGE_REF}"
