---
name: Terraform

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

