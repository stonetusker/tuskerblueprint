name: IDP Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            workloads/demo-service/requirements-dev.txt

      - name: Install validation and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'PyYAML==6.0.2'
          python -m pip install -r workloads/demo-service/requirements-dev.txt

      - name: Validate IDP source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/validate_idp.py

      - name: Validate demo and generated service template
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/demo/validate-demo-source.py

      - name: Validate shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Render Backstage Helm values
        run: |
          set -euo pipefail
          helm repo add backstage https://backstage.github.io/charts
          helm repo update
          helm template backstage backstage/backstage \
            --version 1.10.0 \
            --namespace backstage \
            --values platform-services/backstage/values/development-idp.yaml \
            >/tmp/backstage-rendered.yaml
          grep -q NODE_EXTRA_CA_CERTS /tmp/backstage-rendered.yaml
          grep -q backstage-argocd-ca /tmp/backstage-rendered.yaml
