name: IDP Platform Validation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TUSKER_STRICT_TEMPLATE_VALIDATION: "true"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Current-source secret scan
        id: gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo" -w /repo "${GITLEAKS_IMAGE}" \
            detect --source /repo --no-git --config /repo/.gitleaks.toml \
            --redact --verbose --report-format sarif \
            --report-path /repo/gitleaks-platform.sarif
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Upload secret-scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-gitleaks-${{ github.sha }}
          path: gitleaks-platform.sarif
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce current-source secret scan
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::Gitleaks detected a current-source secret or failed to complete. Review the artifact."
          exit 1
      - name: Install platform and golden-path validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML==6.0.3"
          python -m pip install -r software-templates/tusker-service/skeleton/service/requirements-dev.txt
          python -m pip check
      - run: make validate
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.31.4
      - name: Render platform Kustomizations
        run: |
          set -euo pipefail
          kubectl kustomize gitops/environments/development >/tmp/platform.yaml
          kubectl kustomize platform-services/backstage/manifests >/tmp/backstage.yaml
          test -s /tmp/platform.yaml
          test -s /tmp/backstage.yaml
