name: IDP Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install 'PyYAML==6.0.2' pytest pytest-cov

      - name: Validate IDP source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/validate_idp.py

      - name: Validate shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
