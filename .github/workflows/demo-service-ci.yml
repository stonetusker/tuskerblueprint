name: Demo Service CI and Release

on:
  pull_request:
    paths:
      - 'workloads/demo-service/app/**'
      - 'workloads/demo-service/tests/**'
      - 'workloads/demo-service/Dockerfile'
      - 'workloads/demo-service/requirements*.txt'
      - 'workloads/demo-service/pyproject.toml'
      - 'workloads/demo-service/openapi.yaml'
      - 'apis/demo-service/openapi.yaml'
      - 'scripts/demo/set-demo-release.py'
      - '.github/workflows/demo-service-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workloads/demo-service/app/**'
      - 'workloads/demo-service/tests/**'
      - 'workloads/demo-service/Dockerfile'
      - 'workloads/demo-service/requirements*.txt'
      - 'workloads/demo-service/pyproject.toml'
      - 'workloads/demo-service/openapi.yaml'
      - 'apis/demo-service/openapi.yaml'
      - 'scripts/demo/set-demo-release.py'
      - '.github/workflows/demo-service-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: demo-service-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/stonetusker/tuskerblueprint-demo-service
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  quality-security-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workloads/demo-service/requirements-dev.txt

      - name: Install development dependencies
        working-directory: workloads/demo-service
        run: python -m pip install -r requirements-dev.txt

      - name: Format, lint, and type-check
        working-directory: workloads/demo-service
        run: |
          ruff format --check app tests
          ruff check app tests
          mypy app

      - name: Unit tests and coverage
        working-directory: workloads/demo-service
        run: |
          pytest \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Gitleaks OSS CLI scan
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect \
            --source=/repo \
            --redact \
            --report-format sarif \
            --report-path /repo/gitleaks-demo-service.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks-demo-service.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-demo-service.sarif

      - name: Enforce Gitleaks result
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

      - name: Semgrep scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            --workdir /src/workloads/demo-service \
            --entrypoint semgrep \
            semgrep/semgrep:1.100.0 \
            scan --config auto --error app tests

      - name: Trivy filesystem scan
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}:/work" \
              --entrypoint trivy "${TRIVY_IMAGE}" "$@"
          }
          trivy fs \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            /work/workloads/demo-service

      - name: Build image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            workloads/demo-service

      - name: Trivy image scan
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}:/work" \
              --entrypoint trivy "${TRIVY_IMAGE}" "$@"
          }
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Generate SPDX SBOM
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}:/work" \
              --entrypoint trivy "${TRIVY_IMAGE}" "$@"
          }
          trivy image \
            --format spdx-json \
            --output /work/demo-service.spdx.json \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: demo-service-sbom-${{ github.sha }}
          path: demo-service.spdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and bootstrap tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"

      - name: Update development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/demo/set-demo-release.py \
            --repo-root . \
            --environment development \
            --release "${GITHUB_SHA}"

      - name: Create immutable release pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "release(demo-service): deploy ${{ github.sha }} to development"
          branch: release/demo-service-${{ github.sha }}
          delete-branch: true
          title: "release(demo-service): deploy ${{ github.sha }} to development"
          body: |
            Automated immutable development release generated from `${{ github.sha }}`.

            Review that only `workloads/demo-service/overlays/development/kustomization.yaml` changed.
          add-paths: workloads/demo-service/overlays/development/kustomization.yaml
