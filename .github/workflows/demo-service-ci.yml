name: Demo Service CI and Release

"on":
  pull_request:
    paths:
      - "workloads/demo-service/app/**"
      - "workloads/demo-service/tests/**"
      - "workloads/demo-service/Dockerfile"
      - "workloads/demo-service/requirements*.txt"
      - "workloads/demo-service/pyproject.toml"
      - "workloads/demo-service/openapi.yaml"
      - "apis/demo-service/openapi.yaml"
      - "scripts/demo/set-demo-release.py"
      - ".github/workflows/demo-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "workloads/demo-service/app/**"
      - "workloads/demo-service/tests/**"
      - "workloads/demo-service/Dockerfile"
      - "workloads/demo-service/requirements*.txt"
      - "workloads/demo-service/pyproject.toml"
      - "workloads/demo-service/openapi.yaml"
      - "apis/demo-service/openapi.yaml"
      - "scripts/demo/set-demo-release.py"
      - ".github/workflows/demo-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: demo-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/stonetusker/tuskerblueprint-demo-service
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  quality-security-build:
    name: Quality, security, build and release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workloads/demo-service/requirements.txt
            workloads/demo-service/requirements-dev.txt

      - name: Install development dependencies
        working-directory: workloads/demo-service
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Format, lint and type-check
        working-directory: workloads/demo-service
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check app tests
          ruff check app tests
          mypy app

      - name: Unit tests and coverage
        working-directory: workloads/demo-service
        shell: bash
        run: |
          set -euo pipefail
          pytest \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Prepare current demo-service source for secret scanning
        shell: bash
        run: |
          set -euo pipefail

          SCAN_ROOT="${RUNNER_TEMP}/demo-service-gitleaks"
          rm -rf "${SCAN_ROOT}"

          mkdir -p \
            "${SCAN_ROOT}/workloads" \
            "${SCAN_ROOT}/scripts/demo" \
            "${SCAN_ROOT}/.github/workflows" \
            "${SCAN_ROOT}/apis/demo-service"

          cp -R \
            workloads/demo-service \
            "${SCAN_ROOT}/workloads/demo-service"

          cp \
            scripts/demo/set-demo-release.py \
            "${SCAN_ROOT}/scripts/demo/set-demo-release.py"

          cp \
            .github/workflows/demo-service-ci.yml \
            "${SCAN_ROOT}/.github/workflows/demo-service-ci.yml"

          cp \
            apis/demo-service/openapi.yaml \
            "${SCAN_ROOT}/apis/demo-service/openapi.yaml"

      - name: Gitleaks current-source scan
        id: gitleaks
        shell: bash
        run: |
          set +e

          SCAN_ROOT="${RUNNER_TEMP}/demo-service-gitleaks"
          rm -f gitleaks-demo-service.sarif

          docker run --rm \
            -v "${SCAN_ROOT}:/scan:ro" \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect \
            --source=/scan \
            --no-git \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path /repo/gitleaks-demo-service.sarif

          exit_code=$?
          set -e

          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"

          case "${exit_code}" in
            0)
              echo "Gitleaks completed successfully. No secrets detected."
              ;;
            1)
              echo "::warning::Gitleaks detected one or more potential secrets."
              ;;
            *)
              echo "::warning::Gitleaks failed with exit code ${exit_code}."
              ;;
          esac

          # Upload the redacted report before enforcing the result.
          exit 0

      - name: Print redacted Gitleaks findings
        if: steps.gitleaks.outputs.exit_code == '1'
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s gitleaks-demo-service.sarif ]]; then
            echo "::warning::Gitleaks reported findings but did not create a SARIF report."
            exit 0
          fi

          jq -r '
            .runs[].results[]? |
            "\(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text)"
          ' gitleaks-demo-service.sarif

      - name: Upload redacted Gitleaks report
        if: always() && hashFiles('gitleaks-demo-service.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-demo-service-sarif-${{ github.sha }}
          path: gitleaks-demo-service.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Gitleaks result
        shell: bash
        env:
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
        run: |
          set -euo pipefail

          case "${GITLEAKS_EXIT_CODE}" in
            0)
              echo "Gitleaks passed."
              ;;
            1)
              echo "::error::Gitleaks detected a potential secret in the current demo-service delivery files."
              exit 1
              ;;
            "")
              echo "::error::Gitleaks did not report an exit code."
              exit 1
              ;;
            *)
              echo "::error::Gitleaks failed to execute correctly. Exit code: ${GITLEAKS_EXIT_CODE}"
              exit 1
              ;;
          esac

      - name: Semgrep scan
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${PWD}:/src" \
            --workdir /src/workloads/demo-service \
            --entrypoint semgrep \
            semgrep/semgrep:1.100.0 \
            scan \
            --config auto \
            --error \
            app tests

      - name: Trivy filesystem scan
        shell: bash
        run: |
          set -euo pipefail

          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}:/work" \
              --entrypoint trivy \
              "${TRIVY_IMAGE}" \
              "$@"
          }

          trivy fs \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            /work/workloads/demo-service

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            workloads/demo-service

      - name: Trivy image scan
        shell: bash
        run: |
          set -euo pipefail

          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}:/work" \
              --entrypoint trivy \
              "${TRIVY_IMAGE}" \
              "$@"
          }

          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail

          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}:/work" \
              --entrypoint trivy \
              "${TRIVY_IMAGE}" \
              "$@"
          }

          trivy image \
            --format spdx-json \
            --output /work/demo-service.spdx.json \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: demo-service-sbom-${{ github.sha }}
          path: demo-service.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and bootstrap tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}:main"

          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"

      - name: Verify immutable image was published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if docker manifest inspect \
              "${IMAGE_NAME}:${GITHUB_SHA}" \
              >/dev/null 2>&1; then
              echo "Published image verified: ${IMAGE_NAME}:${GITHUB_SHA}"
              exit 0
            fi

            echo "Image manifest is not available yet. Attempt ${attempt}/5."
            sleep 10
          done

          echo "::error::The immutable image tag was not found in GHCR after publishing."
          exit 1

      - name: Update development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          python scripts/demo/set-demo-release.py \
            --repo-root . \
            --environment development \
            --release "${GITHUB_SHA}"

      - name: Verify release file changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_FILE="workloads/demo-service/overlays/development/kustomization.yaml"

          grep -F "${GITHUB_SHA}" "${RELEASE_FILE}"

          if git diff --quiet -- "${RELEASE_FILE}"; then
            echo "::notice::The development overlay already references ${GITHUB_SHA}."
          else
            echo "Development release updated to ${GITHUB_SHA}."
            git diff -- "${RELEASE_FILE}"
          fi

      - name: Create immutable release pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "release(demo-service): deploy ${{ github.sha }} to development"
          branch: release/demo-service-${{ github.sha }}
          delete-branch: true
          title: "release(demo-service): deploy ${{ github.sha }} to development"
          body: |
            Automated immutable development release generated from `${{ github.sha }}`.

            The workflow completed:

            - formatting, linting and type checking;
            - unit tests and coverage;
            - current-source Gitleaks scanning;
            - Semgrep scanning;
            - Trivy filesystem and image scanning;
            - SPDX SBOM generation;
            - immutable GHCR image publication;
            - remote image-manifest verification.

            Published image:

            `ghcr.io/stonetusker/tuskerblueprint-demo-service:${{ github.sha }}`

            Review that only the following file changed:

            `workloads/demo-service/overlays/development/kustomization.yaml`
          add-paths: |
            workloads/demo-service/overlays/development/kustomization.yaml
          labels: |
            automated
            demo-service
            release
