rules:
  - id: no-subprocess-shell-true
    message: Avoid shell=True because untrusted input can lead to command injection.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: no-eval
    message: Do not execute dynamic Python with eval().
    severity: ERROR
    languages: [python]
    pattern: eval(...)

  - id: no-hardcoded-demo-secret
    message: Do not place secrets in application source.
    severity: ERROR
    languages: [python]
    pattern-regex: >-
      (?i)(password|secret|api_key)\s*=\s*["'][^"']{8,}["']
