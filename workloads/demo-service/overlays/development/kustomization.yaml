apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-service-development
resources:
  - ../../base

images:
  - name: ghcr.io/stonetusker/tuskerblueprint-demo-service
    newName: ghcr.io/stonetusker/tuskerblueprint-demo-service
    newTag: 9691d61bb174d0a3cc4e3b173ba3513d14135cd4

replicas:
  - name: demo-service
    count: 1

configMapGenerator:
  - name: demo-service-config
    behavior: merge
    literals:
      - DEMO_FAILURE_MODE=none
      - FAILURE_DELAY_MS=2500

commonLabels:
  app.kubernetes.io/environment: development

commonAnnotations:
  tuskerblueprint.io/release-sha: 9691d61bb174d0a3cc4e3b173ba3513d14135cd4
