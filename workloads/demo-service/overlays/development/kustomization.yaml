apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-service-development
resources:
  - ../../base

images:
  - name: ghcr.io/stonetusker/tuskerblueprint-demo-service
    newName: ghcr.io/stonetusker/tuskerblueprint-demo-service
    newTag: f86cde313a49b7639826cb364831eaf756f40eb9

replicas:
  - name: demo-service
    count: 1

configMapGenerator:
  - name: demo-service-config
    behavior: merge
    literals:
      - DEMO_FAILURE_MODE=none
      - FAILURE_DELAY_MS=2500

commonLabels:
  app.kubernetes.io/environment: development

commonAnnotations:
  tuskerblueprint.io/release-sha: f86cde313a49b7639826cb364831eaf756f40eb9
