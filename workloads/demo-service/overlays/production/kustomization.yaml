apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-service-production
resources:
  - ../../base

images:
  - name: ghcr.io/stonetusker/tuskerblueprint-demo-service
    newName: ghcr.io/stonetusker/tuskerblueprint-demo-service
    newTag: main

replicas:
  - name: demo-service
    count: 3

configMapGenerator:
  - name: demo-service-config
    behavior: merge
    literals:
      - DEMO_FAILURE_MODE=none
      - FAILURE_DELAY_MS=2500

commonLabels:
  app.kubernetes.io/environment: production

commonAnnotations:
  tuskerblueprint.io/release-sha: main
