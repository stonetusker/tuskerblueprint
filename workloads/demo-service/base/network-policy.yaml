apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-service-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-service
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-service-allow-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - traefik-development
                  - traefik-staging
                  - traefik-production
                  - monitoring
                  - backstage
      ports:
        - port: 8000
          protocol: TCP
