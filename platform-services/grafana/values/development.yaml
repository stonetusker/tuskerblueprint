# ==============================================================================
# TuskerBlueprint
# Grafana Helm Values
# Environment: Development
# ==============================================================================

adminUser: admin

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false
        jsonData:
          # Must match Prometheus server.global.scrape_interval. Grafana uses
          # this value to calculate a safe $__rate_interval for counters.
          timeInterval: 15s
          httpMethod: POST
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Stonetusker Demo
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/default

# The ConfigMap is reconciled by the third source in the Grafana Argo CD
# Application. Keeping JSON outside Helm values makes dashboard validation and
# future reviews deterministic.
dashboardsConfigMaps:
  default: grafana-dashboard-demo-service
