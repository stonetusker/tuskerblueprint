# ==============================================================================
# TuskerBlueprint
# Grafana Helm Values
# Environment: Development
# ==============================================================================

adminUser: admin

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: tusker-services
        orgId: 1
        folder: Stonetusker Demo
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    tusker-service-overview:
      json: |
        {
          "annotations": {
            "list": []
          },
          "editable": false,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "links": [],
          "liveNow": false,
          "panels": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "decimals": 1,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 95
                      },
                      {
                        "color": "green",
                        "value": 99
                      }
                    ]
                  },
                  "unit": "percent"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 6,
                "x": 0,
                "y": 0
              },
              "id": 1,
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto",
                "wideLayout": true
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "100 * sum(kube_deployment_status_replicas_available{namespace=\"${service}-${environment}\",deployment=\"$service\"}) / clamp_min(sum(kube_deployment_spec_replicas{namespace=\"${service}-${environment}\",deployment=\"$service\"}), 1)",
                  "instant": true,
                  "legendFormat": "Availability",
                  "range": false,
                  "refId": "A"
                }
              ],
              "title": "Replica availability",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "decimals": 2,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  },
                  "unit": "reqps"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 6,
                "x": 6,
                "y": 0
              },
              "id": 2,
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto",
                "wideLayout": true
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum(rate(http_requests_total{service=\"$service\",environment=\"$environment\",route!~\"/metrics|/healthz|/readyz\"}[$__rate_interval]))",
                  "instant": false,
                  "legendFormat": "Requests/sec",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Request rate",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "decimals": 2,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 1
                      },
                      {
                        "color": "red",
                        "value": 5
                      }
                    ]
                  },
                  "unit": "percent"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 6,
                "x": 12,
                "y": 0
              },
              "id": 3,
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto",
                "wideLayout": true
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "100 * sum(rate(http_requests_total{service=\"$service\",environment=\"$environment\",route!~\"/metrics|/healthz|/readyz\",status=~\"5..\"}[$__rate_interval])) / clamp_min(sum(rate(http_requests_total{service=\"$service\",environment=\"$environment\",route!~\"/metrics|/healthz|/readyz\"}[$__rate_interval])), 0.001)",
                  "instant": false,
                  "legendFormat": "5xx percentage",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "5xx error percentage",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "decimals": 3,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 0.5
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  },
                  "unit": "s"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 6,
                "x": 18,
                "y": 0
              },
              "id": 4,
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto",
                "wideLayout": true
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"$service\",environment=\"$environment\",route!~\"/metrics|/healthz|/readyz\"}[$__rate_interval])))",
                  "instant": false,
                  "legendFormat": "p95",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "p95 latency",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 14,
                "x": 0,
                "y": 5
              },
              "id": 5,
              "options": {
                "legend": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "displayMode": "table",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum by (method, route, status) (rate(http_requests_total{service=\"$service\",environment=\"$environment\",route!~\"/metrics|/healthz|/readyz\"}[$__rate_interval]))",
                  "legendFormat": "{{method}} {{route}} [{{status}}]",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Requests by route and status",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "decimals": 0,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "blue",
                        "value": null
                      }
                    ]
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 10,
                "x": 14,
                "y": 5
              },
              "id": 6,
              "options": {
                "displayMode": "gradient",
                "maxVizHeight": 300,
                "minVizHeight": 16,
                "minVizWidth": 8,
                "namePlacement": "auto",
                "orientation": "horizontal",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "showUnfilled": true,
                "sizing": "auto",
                "valueMode": "color"
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum by (channel) (increase(notification_requests_total{service=\"$service\",environment=\"$environment\"}[$__range]))",
                  "instant": true,
                  "legendFormat": "{{channel}}",
                  "range": false,
                  "refId": "A"
                }
              ],
              "title": "Notifications accepted in selected period",
              "type": "bargauge"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "decimals": 0,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 8,
                "x": 0,
                "y": 13
              },
              "id": 7,
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto",
                "wideLayout": true
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum(kube_deployment_status_replicas_available{namespace=\"${service}-${environment}\",deployment=\"$service\"})",
                  "instant": true,
                  "legendFormat": "Ready replicas",
                  "range": false,
                  "refId": "A"
                }
              ],
              "title": "Ready replicas",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 8,
                "x": 8,
                "y": 13
              },
              "id": 8,
              "options": {
                "colorMode": "value",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "name",
                "wideLayout": true
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "max by (version) (application_info{service=\"$service\",environment=\"$environment\"})",
                  "instant": true,
                  "legendFormat": "{{version}}",
                  "range": false,
                  "refId": "A"
                }
              ],
              "title": "Running release",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "decimals": 0,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 1
                      },
                      {
                        "color": "red",
                        "value": 3
                      }
                    ]
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 8,
                "x": 16,
                "y": 13
              },
              "id": 9,
              "options": {
                "colorMode": "background",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto",
                "wideLayout": true
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"${service}-${environment}\",container=\"app\"}[15m]))",
                  "instant": true,
                  "legendFormat": "Restarts",
                  "range": false,
                  "refId": "A"
                }
              ],
              "title": "Restarts in 15 minutes",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "h": 11,
                "w": 24,
                "x": 0,
                "y": 18
              },
              "id": 10,
              "description": "Requires Loki and the optional Alloy log collector. Use kubectl logs until Alloy is validated and activated.",
              "options": {
                "dedupStrategy": "none",
                "enableLogDetails": true,
                "prettifyLogMessage": false,
                "showCommonLabels": false,
                "showLabels": false,
                "showTime": true,
                "sortOrder": "Descending",
                "wrapLogMessage": true
              },
              "targets": [
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "editorMode": "code",
                  "expr": "{namespace=\"${service}-${environment}\",app=\"$service\"} | json",
                  "queryType": "range",
                  "refId": "A"
                }
              ],
              "title": "Application logs",
              "type": "logs"
            }
          ],
          "refresh": "10s",
          "schemaVersion": 39,
          "tags": [
            "stonetusker",
            "tuskerblueprint",
            "golden-path",
            "service-overview"
          ],
          "templating": {
            "list": [
              {
                "current": {
                  "selected": true,
                  "text": "development",
                  "value": "development"
                },
                "hide": 0,
                "includeAll": false,
                "label": "Environment",
                "multi": false,
                "name": "environment",
                "options": [
                  {
                    "selected": true,
                    "text": "development",
                    "value": "development"
                  },
                  {
                    "selected": false,
                    "text": "staging",
                    "value": "staging"
                  },
                  {
                    "selected": false,
                    "text": "production",
                    "value": "production"
                  }
                ],
                "query": "development,staging,production",
                "skipUrlSync": false,
                "type": "custom"
              },
              {
                "current": {},
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "definition": "label_values(application_info{environment=\"$environment\"}, service)",
                "hide": 0,
                "includeAll": false,
                "label": "Service",
                "multi": false,
                "name": "service",
                "options": [],
                "query": {
                  "query": "label_values(application_info{environment=\"$environment\"}, service)",
                  "refId": "StandardVariableQuery"
                },
                "refresh": 2,
                "regex": "",
                "skipUrlSync": false,
                "sort": 1,
                "type": "query"
              }
            ]
          },
          "time": {
            "from": "now-15m",
            "to": "now"
          },
          "timepicker": {},
          "timezone": "browser",
          "title": "Tusker Service Overview",
          "uid": "tusker-service-overview",
          "version": 1,
          "weekStart": ""
        }
