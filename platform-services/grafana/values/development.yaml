# ==============================================================================
# TuskerBlueprint
# Grafana Helm Values
# Environment: Development
# ==============================================================================

adminUser: admin

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Stonetusker Demo
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    demo-service-delivery:
      json: |
        {
          "annotations": {"list": []},
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "links": [],
          "liveNow": false,
          "panels": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
              "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
              "id": 1,
              "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
              "targets": [{"expr": "sum(rate(http_requests_total{service=\"demo-service\"}[1m]))", "legendFormat": "requests/sec", "refId": "A"}],
              "title": "Request rate",
              "type": "timeseries"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
              "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
              "id": 2,
              "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
              "targets": [{"expr": "sum(rate(http_requests_total{service=\"demo-service\",status=~\"5..\"}[1m]))", "legendFormat": "5xx/sec", "refId": "A"}],
              "title": "Error rate",
              "type": "timeseries"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
              "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
              "id": 3,
              "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
              "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"demo-service\"}[5m])))", "legendFormat": "p95", "refId": "A"}],
              "title": "p95 latency",
              "type": "timeseries"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []},
              "gridPos": {"h": 6, "w": 8, "x": 0, "y": 8},
              "id": 4,
              "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
              "targets": [{"expr": "sum(kube_deployment_status_replicas_available{namespace=\"demo-service-development\",deployment=\"demo-service\"})", "refId": "A"}],
              "title": "Ready replicas",
              "type": "stat"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {}, "overrides": []},
              "gridPos": {"h": 6, "w": 8, "x": 8, "y": 8},
              "id": 5,
              "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "name"},
              "targets": [{"expr": "application_info{service=\"demo-service\",environment=\"development\"}", "legendFormat": "{{version}}", "refId": "A"}],
              "title": "Running release",
              "type": "stat"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {}, "overrides": []},
              "gridPos": {"h": 6, "w": 8, "x": 16, "y": 8},
              "id": 6,
              "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
              "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"demo-service-development\",container=\"app\"}[15m]))", "refId": "A"}],
              "title": "Restarts in 15 minutes",
              "type": "stat"
            },
            {
              "datasource": {"type": "loki", "uid": "loki"},
              "gridPos": {"h": 10, "w": 24, "x": 0, "y": 14},
              "id": 7,
              "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
              "targets": [{"expr": "{namespace=\"demo-service-development\", app=\"demo-service\"} | json", "refId": "A"}],
              "title": "Demo service logs",
              "type": "logs"
            }
          ],
          "refresh": "10s",
          "schemaVersion": 39,
          "tags": ["stonetusker", "demo-service", "delivery-platform"],
          "templating": {"list": []},
          "time": {"from": "now-15m", "to": "now"},
          "timepicker": {},
          "timezone": "browser",
          "title": "Stonetusker Demo Service Delivery",
          "uid": "stonetusker-demo-service",
          "version": 1,
          "weekStart": ""
        }
