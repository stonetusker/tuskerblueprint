apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: kubernetes-platform-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Limit use of this cluster-scoped store to platform-owned namespaces.
  # Conditions are ORed: approved Backstage namespaces or Argo-managed workloads.
  conditions:
    - namespaces:
        - backstage
        - backstage-staging
        - backstage-production
    - namespaceSelector:
        matchLabels:
          platform.stonetusker.com/workload: "true"
  provider:
    kubernetes:
      remoteNamespace: platform-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: platform-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: platform-secret-reader
          namespace: platform-secrets
