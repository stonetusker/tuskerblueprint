backstage:
  image:
    repository: ghcr.io/backstage/backstage
    tag: "1.42.0" # Replace with the chosen pinned release
    pullPolicy: IfNotPresent

  appConfig:
    app:
      title: TuskerBlueprint Developer Portal
      baseUrl: http://localhost:3000

    backend:
      baseUrl: http://backstage.backstage.svc.cluster.local:7007
      listen:
        port: 7007

    auth:
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    catalog:
      rules:
        - allow:
            - Component
            - System
            - API
            - Resource
            - Location
            - Template
            - User
            - Group
            - Domain

    organization:
      name: TuskerBlueprint

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false