backstage:
  image:
    repository: ghcr.io/backstage/backstage:1.34.1
    pullPolicy: IfNotPresent

  extraEnvVars:
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-github-credentials
          key: GITHUB_TOKEN


  appConfig:
    app:
      title: TuskerBlueprint Developer Portal
      baseUrl: http://localhost:7007
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007

    auth:
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    catalog:
      locations:
        - type: url
          target: https://github.com/stonetusker/tuskerblueprint/blob/main/catalog-info.yaml
      rules:
        - allow:
            - Component
            - API
            - Resource
            - System
            - Domain
            - Group
            - User
            - Location
            - Template

    organization:
      name: TuskerBlueprint

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
