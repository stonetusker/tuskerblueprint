backstage:
  image:
    repository: ghcr.io/backstage/backstage
    tag: "1.34.1"
    pullPolicy: IfNotPresent

  appConfig:
    app:
      title: TuskerBlueprint Developer Portal
      baseUrl: http://localhost:7007

    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007

    auth:
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    catalog:
      rules:
        - allow:
            - Component
            - API
            - Resource
            - System
            - Domain
            - Group
            - User
            - Location
            - Template

    organization:
      name: TuskerBlueprint

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false