app:
  title: TuskerBlueprint Internal Developer Portal
  baseUrl: http://localhost:7007

organization:
  name: TuskerBlueprint

backend:
  baseUrl: http://localhost:7007

  listen:
    port: 7007

  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

catalog:
  rules:
    - allow:
        - Component
        - API
        - Resource
        - Group
        - User
        - System
        - Location
        - Template
