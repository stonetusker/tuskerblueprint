apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-auth-secrets
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: backstage-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: backstage/auth
        property: githubClientId
    - secretKey: AUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: backstage/auth
        property: githubClientSecret
    - secretKey: BACKEND_SECRET
      remoteRef:
        key: backstage/auth
        property: backendSecret
