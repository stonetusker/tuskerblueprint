apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-argocd-credentials
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: backstage-argocd-credentials
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_AUTH_TOKEN
      remoteRef:
        key: backstage/argocd
        property: readToken
