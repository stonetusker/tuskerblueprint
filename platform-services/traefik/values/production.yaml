# ==============================================================================
# TuskerBlueprint
# Traefik Helm Values
# Environment: Production
# ==============================================================================

deployment:
  replicas: 2

nameOverride: traefik-production
fullnameOverride: traefik-production

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-production

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

logs:
  general:
    level: INFO

accessLog:
  enabled: true

metrics:
  prometheus:
    enabled: true

dashboard:
  enabled: false

service:
  type: LoadBalancer

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
