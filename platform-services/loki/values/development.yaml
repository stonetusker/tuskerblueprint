# ==============================================================================
# TuskerBlueprint
# Loki Helm Values
# Environment: Development
# ==============================================================================

# Explicitly set SingleBinary mode so Helm doesn't spin up SimpleScalable targets
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  # Prevents 'nil pointer' storage template errors in Loki 6.x
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

singleBinary:
  replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi