# ==============================================================================
# TuskerBlueprint
# Loki Helm Values
# Environment: Development
# ==============================================================================

loki:
  auth_enabled: false
  
  # Added to prevent Helm template 'nil pointer' crashes in Loki 6.x
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

singleBinary:
  replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi