# ==============================================================================
# TuskerBlueprint
# Loki Helm Values
# Environment: Development
# ==============================================================================

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  limits_config:
    allow_structured_metadata: true

  # Development runs one Loki binary. Matching the replication factor to that
  # topology prevents writes from waiting for replicas that do not exist.
  commonConfig:
    replication_factor: 1
  
  # Tells Loki to use the default local TSDB schema for development
  useTestSchema: true
  
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

singleBinary:
  replicas: 1

# Explicitly disable SimpleScalable targets to pass Helm validation
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
