# ==============================================================================
# TuskerBlueprint
# cert-manager Helm Values
# Environment: Staging
# ==============================================================================

crds:
  enabled: true

installCRDs: false

replicaCount: 1

global:
  leaderElection:
    namespace: cert-manager

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
