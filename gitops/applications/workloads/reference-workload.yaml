apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-workload
  labels:
    app.kubernetes.io/name: reference-workload
    app.kubernetes.io/part-of: tuskerblueprint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reference-workload
  template:
    metadata:
      labels:
        app: reference-workload
    spec:
      containers:
        - name: reference-workload
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: reference-workload
  labels:
    app.kubernetes.io/name: reference-workload
    app.kubernetes.io/part-of: tuskerblueprint
spec:
  selector:
    app: reference-workload
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
